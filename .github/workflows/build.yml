name: Build & Release

on:
  push:
    tags: ['v*']
  # PRs into main build both legs (tests included) but publish nothing: the
  # release inputs below are empty unless the run is for a tag.
  pull_request:
    branches: [main]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows installer (NSIS .exe)
          - platform: windows-latest
            args: ''
          # macOS Apple Silicon (.dmg + .app.tar.gz). Signed with one stable
          # self-signed code-signing certificate (APPLE_CERTIFICATE secrets) so
          # the app keeps the same designated requirement across auto-updates,
          # which is what keeps the "control Mail" (Automation) permission.
          # The login-keychain item may still ask once per update ("Always
          # Allow"): a self-signed identity has no Team ID. Not notarised (no
          # Apple Developer ID), so Gatekeeper still warns on first install.
          # Without the secrets it falls back to ad-hoc signing with a
          # warning. tauri-action merges this platform's entry into the shared
          # latest.json.
          - platform: macos-14
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      # Rust unit tests (Mail connector etc.). macOS only: some tests shell
      # out to `node` (from setup-node above) and the connector is macOS-only.
      - name: cargo test
        if: matrix.platform == 'macos-14'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Import the stable self-signed signing certificate into a temporary
      # keychain and hand tauri-action only the identity name. APPLE_CERTIFICATE
      # is deliberately NOT exported to tauri-action: it would import the
      # certificate again into its own keychain, where the self-signed cert
      # can't be trusted non-interactively.
      - name: Set up macOS code signing
        if: matrix.platform == 'macos-14'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "::warning title=Ad-hoc signing::No APPLE_CERTIFICATE secret, so this build is ad-hoc signed. macOS will forget the \"control Mail\" permission after this update (and the keychain will ask again). The mail-connector PR body explains how to add the certificate secrets (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY)."
            exit 0
          fi
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "::error title=Signing secrets incomplete::APPLE_CERTIFICATE is set but APPLE_SIGNING_IDENTITY (the certificate's common name) is not."
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/flow-tasks-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/flow-tasks-signing.p12"
          PEM_PATH="$RUNNER_TEMP/flow-tasks-signing.pem"
          trap 'rm -f "$CERT_PATH" "$PEM_PATH"' EXIT

          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          # Temporary keychain, unlocked for 6 h, added to the user search list
          # in front of the existing keychains (kept).
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          keychains=("$KEYCHAIN_PATH")
          while IFS= read -r kc; do
            if [ -n "$kc" ] && [ "$kc" != "$KEYCHAIN_PATH" ]; then keychains+=("$kc"); fi
          done < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"(.*)"[[:space:]]*$/\1/')
          security list-keychains -d user -s "${keychains[@]}"

          # Import the certificate + private key; let codesign use the key
          # without a prompt.
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -f pkcs12 \
            -P "${APPLE_CERTIFICATE_PASSWORD:-}" -T /usr/bin/codesign > /dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null

          # A self-signed identity isn't "valid" for codesign until its
          # certificate is trusted for code signing.
          security find-certificate -c "$APPLE_SIGNING_IDENTITY" -p "$KEYCHAIN_PATH" > "$PEM_PATH"
          if [ ! -s "$PEM_PATH" ]; then
            echo "::error title=Signing certificate not found::No certificate matching APPLE_SIGNING_IDENTITY in the imported .p12."
            exit 1
          fi
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$PEM_PATH"

          # Capture, then grep: piping into `grep -q` can SIGPIPE the producer
          # and fail the step under pipefail.
          ids="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          if ! grep -Fq "\"$APPLE_SIGNING_IDENTITY\"" <<<"$ids"; then
            echo "::error title=Signing identity not valid::The imported certificate is not a valid code-signing identity (check the .p12 holds the private key and the certificate type is Code Signing)."
            exit 1
          fi
          echo "Code-signing identity imported and trusted."

          # tauri-action's bundler reads APPLE_SIGNING_IDENTITY (overriding
          # signingIdentity "-" in tauri.conf.json) and finds the identity
          # through the keychain search list.
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # minisign updater signing — cross-platform, unrelated to Apple
          # code signing. Both matrix legs sign their own updater artifacts.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Empty unless this run is for a tag: with no tagName/releaseId,
          # tauri-action builds and skips every upload (no release, no
          # latest.json).
          tagName: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"
          releaseName: "${{ startsWith(github.ref, 'refs/tags/') && format('Flow Tasks {0}', github.ref_name) || '' }}"
          releaseBody: "${{ startsWith(github.ref, 'refs/tags/') && 'Download the installer for your platform below. Windows: .exe. macOS: .dmg — not notarised, so macOS blocks the first launch once: open System Settings → Privacy & Security → Open Anyway (older macOS: right-click the app → Open). Updates install themselves.' || '' }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Show macOS signature
        if: matrix.platform == 'macos-14'
        shell: bash
        run: |
          set -euo pipefail
          apps=(src-tauri/target/release/bundle/macos/*.app)
          app="${apps[0]}"
          info="$(codesign -dv --verbose=2 "$app" 2>&1)"
          grep -E '^(Identifier|Authority|TeamIdentifier|Signature)=' <<<"$info" || true
          # The designated requirement: identical across releases means the
          # identity is stable (macOS keys the Mail permission to it). Not secret.
          codesign -d -r- "$app"
          codesign -d --entitlements - --xml "$app"

      # Checks the fixed path itself (the same name the setup step uses), so it
      # also cleans up when that step failed before finishing.
      - name: Delete temporary signing keychain
        if: always() && matrix.platform == 'macos-14'
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/flow-tasks-signing.keychain-db"
          if [ -f "$keychain" ]; then
            security delete-keychain "$keychain"
            echo "Temporary signing keychain deleted."
          fi
