name: Build & Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows installer (NSIS .exe)
          - platform: windows-latest
            args: ''
          # macOS Apple Silicon (.dmg + .app.tar.gz). Unsigned for now — no
          # Apple Developer ID / notarization; the arm64 binary is still
          # ad-hoc-signed at link time so it runs. tauri-action merges this
          # platform's entry into the shared latest.json.
          - platform: macos-14
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # minisign updater signing — cross-platform, unrelated to Apple
          # code signing. Both matrix legs sign their own updater artifacts.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Flow Tasks ${{ github.ref_name }}"
          releaseBody: "Download the installer for your platform below. Windows: .exe. macOS: .dmg (first launch is unsigned — right-click the app → Open)."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
